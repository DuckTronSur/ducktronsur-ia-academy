<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>START v0.4 · Lección</title>
<style>
:root{--navy:#06152e;--cyan:#00cfff;--paper:#eaf3f7;--ink:#102b44;--muted:#5a7182;--yellow:#ffc83d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:1040px;margin:auto;padding:20px 18px 60px}header{padding:24px;border-radius:20px;background:var(--navy);color:#fff}header p{color:#75e6ff;font-size:.75rem;letter-spacing:.12em;font-weight:700}h1{margin:8px 0;font-size:clamp(2rem,6vw,4rem)}header small{color:#d8e7f0}.back{display:inline-block;margin:18px 0;color:#087ca4;font-weight:700;text-decoration:none}.lesson{background:#fff;border:1px solid #cfdee6;border-radius:18px;padding:22px}.lesson-visual{display:block;width:100%;max-width:760px;margin:0 auto 22px;border-radius:12px}.meta{color:var(--muted);font-size:.88rem}.content h2{color:var(--navy);margin-top:28px;font-size:1.35rem}.content p{line-height:1.65}.content .label{font-weight:700;color:#176a85}.content a{color:#087ca4}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}.button{display:inline-block;padding:12px 16px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}.button.secondary{background:#fff;color:#087ca4;border:1px solid #087ca4}@media(max-width:680px){.shell{padding:14px 12px 40px}.lesson{padding:16px}.content p{font-size:.98rem}}
</style>
</head>
<body><main class="shell">
<header><p>DUCKTRONSUR IA ACADEMY · START v0.4</p><h1 id="title">Cargando lección…</h1><small>Vista candidata de contenidos integrados. No publicada ni conectada a producción.</small></header>
<a class="back" href="start-v0.4.html">← Volver a la ruta START v0.4</a>
<article class="lesson">
<img id="visual" class="lesson-visual" alt="">
<p id="meta" class="meta"></p>
<section id="content" class="content"></section>
<div class="actions"><a id="previous" class="button secondary" href="#">← Anterior</a><a id="next" class="button" href="#">Siguiente →</a></div>
</article>
</main>
<script src="start-v0.4-lessons.js"></script>
<script>
const params=new URLSearchParams(location.search), n=Math.min(8,Math.max(1,Number(params.get('leccion')||1)));
const lesson=START_V04_LESSONS[n-1], pad=String(n).padStart(2,'0');
document.title='START v0.4 · L'+pad+' · '+lesson.title;
document.querySelector('#title').textContent='L'+pad+' · '+lesson.title;
document.querySelector('#meta').textContent='Contenido editorial candidato · '+lesson.source+' · aprobado para integración visual; pendiente de publicación.';
const visual=document.querySelector('#visual'); visual.src=lesson.visual; visual.alt='Recurso visual aprobado de L'+pad+': '+lesson.title+'.';
document.querySelector('#content').innerHTML=lesson.contentHtml;
const prev=document.querySelector('#previous'),next=document.querySelector('#next');
if(n===1){prev.textContent='← Volver a la ruta';prev.href='start-v0.4.html';}else{prev.href='start-v0.4-leccion.html?leccion='+(n-1);}
if(n===8){next.textContent='Volver a la ruta →';next.href='start-v0.4.html';}else{next.href='start-v0.4-leccion.html?leccion='+(n+1);}
</script>
</body></html>
