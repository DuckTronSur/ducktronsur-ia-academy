<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>START v0.4 · Evaluación candidata</title>
<style>:root{--navy:#06152e;--paper:#eaf3f7;--ink:#102b44;--muted:#5a7182;--yellow:#ffc83d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:20px 16px 60px}header{padding:24px;border-radius:20px;background:var(--navy);color:#fff}header p{color:#75e6ff;font-size:.75rem;letter-spacing:.12em;font-weight:700}h1{margin:8px 0;font-size:clamp(2rem,6vw,3.6rem)}header small{color:#d8e7f0}.notice{margin:18px 0;padding:14px;border:2px solid var(--yellow);border-radius:12px;background:#fff9df}.q{background:#fff;border:1px solid #cfdee6;border-radius:14px;padding:18px;margin:14px 0}.q legend{font-weight:700}.option{display:block;padding:10px;margin:8px 0;border:1px solid #dfe7ec;border-radius:9px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.button{border:0;border-radius:10px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.button.secondary{background:#fff;color:#087ca4;border:1px solid #087ca4}.status{font-weight:700;margin-top:16px}.result{background:#e8f7eb;padding:16px;border-radius:10px;margin-top:16px}.result.fail{background:#fff0e9}@media(max-width:680px){.shell{padding:14px 12px 40px}.q{padding:14px}.option{font-size:.96rem}}</style></head>
<body><main class="shell"><header><p>DUCKTRONSUR IA ACADEMY · START v0.4</p><h1>Evaluación candidata</h1><small>40 preguntas · cinco por lección · vista de pruebas sin autenticación ni Supabase.</small></header>
<div class="notice"><strong>Estado:</strong> banco v0.2 candidato, pendiente de revisión editorial y docente. Esta prueba no guarda resultados.</div>
<a href="start-v0.4.html">← Volver a la ruta START v0.4</a><form id="quiz"></form><div class="actions"><button class="button" type="submit" form="quiz">Corregir evaluación</button><button class="button secondary" type="button" id="reset">Reiniciar</button></div><p id="status" class="status"></p><div id="result" class="result" hidden></div></main>
<script src="start-v0.4-assessment.js"></script><script>
const form=document.querySelector('#quiz'); form.innerHTML=START_V04_ASSESSMENT.questions.map((q,i)=>'<fieldset class="q"><legend>'+q.id+' · '+q.prompt+'</legend>'+q.options.map(o=>'<label class="option"><input required type="radio" name="'+q.id+'" value="'+o.key+'"> '+o.key+'. '+o.text+'</label>').join('')+'</fieldset>').join('');
form.addEventListener('submit',e=>{e.preventDefault();let score=0;START_V04_ASSESSMENT.questions.forEach(q=>{const a=form.querySelector('input[name="'+q.id+'"]:checked');if(a&&q.options.find(o=>o.key===a.value)?.correct)score++;});const pct=Math.round(score/START_V04_ASSESSMENT.questions.length*100);document.querySelector('#status').textContent='Corrección local completada; no se ha guardado ningún resultado.';const r=document.querySelector('#result');r.hidden=false;r.className='result '+(pct>=START_V04_ASSESSMENT.passPercent?'':'fail');r.innerHTML='<strong>'+(pct>=START_V04_ASSESSMENT.passPercent?'Resultado provisional: superado':'Resultado provisional: no superado')+'</strong><br>'+score+'/40 · '+pct+'% · umbral provisional '+START_V04_ASSESSMENT.passPercent+'%';});
document.querySelector('#reset').addEventListener('click',()=>{form.reset();document.querySelector('#result').hidden=true;document.querySelector('#status').textContent='';});
</script></body></html>
