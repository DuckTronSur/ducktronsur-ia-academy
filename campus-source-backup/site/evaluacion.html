<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluación · DuckTronSur IA Academy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand-overrides.css">
  <style>
    .assessment-page{max-width:900px;margin:0 auto;padding:48px 24px 80px}.assessment-card{background:#fff;border:1px solid rgba(8,25,51,.16);padding:24px;margin-top:24px}.assessment-form{display:grid;gap:12px;max-width:430px}.assessment-form input{padding:12px;border:1px solid #ccd5df;border-radius:8px;font:inherit}.assessment-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.assessment-question{border:0;border-top:1px solid #e3e8ee;padding:24px 0;scroll-margin-top:24px}.assessment-question:first-child{border-top:0}.assessment-question.incomplete{border:2px solid #d97706;border-radius:10px;padding:22px 14px;background:#fff8e8;animation:assessment-pulse 1.2s ease-in-out 2}.assessment-option{display:block;padding:10px 12px;margin:8px 0;border:1px solid #dfe5eb;border-radius:8px}.assessment-status{min-height:24px;margin-top:16px}.assessment-status.alert{color:#9a3412;font-weight:700}.assessment-result{padding:16px;background:#eef7ec;margin-top:20px}.assessment-result.fail{background:#fff1eb}.assessment-hidden{display:none}.muted{color:#52657a}@keyframes assessment-pulse{50%{box-shadow:0 0 0 5px #f59e0b55}}
  </style>
<link rel="stylesheet" href="/academy-mobile-nav.css?v=171"><script defer src="/academy-mobile-nav.js?v=171"></script></head>
<body class="assessment-screen">
  <header class="academy-header"><nav class="academy-nav" aria-label="Navegación principal"><a class="academy-brand" href="/"><img src="/assets/logo-horizontal.png" alt="DuckTronSur IA Academy"></a><div class="academy-links"><a href="/">Inicio</a><a href="/#rutas" aria-current="page">Rutas</a><a href="/prompteca.html">Prompteca</a><a href="/pildoras.html">Recursos</a><a href="/empresas.html">Empresas</a><a href="/mi-campus.html">Mi Campus</a><a class="academy-access" href="/auth.html">Acceder</a></div><button class="academy-mobile-toggle" id="academy-mobile-toggle" type="button" aria-expanded="false" aria-controls="academy-mobile-menu">☰ Menú</button><div class="academy-mobile-menu" id="academy-mobile-menu" hidden><a href="/">Inicio</a><a href="/#rutas">Rutas</a><a href="/prompteca.html">Prompteca</a><a href="/pildoras.html">Recursos</a><a href="/empresas.html">Empresas</a><a href="/auth.html" data-guest-only>Acceder</a><a href="/mi-campus.html" data-member-only hidden>Mi Campus</a><a href="/perfil.html" data-member-only hidden>Mi perfil</a><button type="button" id="academy-mobile-logout" data-member-only hidden>Cerrar sesión</button></div></nav></header><a class="academy-campus-shortcut" id="academy-campus-shortcut" href="/mi-campus.html" hidden>Mi Campus</a><nav class="route-level-menu" aria-label="Rutas de aprendizaje"><a href="/ruta.html?ruta=start-v0-4" data-route-level="start-v0-4">START</a><a href="/ruta.html?ruta=intermedio" data-route-level="intermedio">INTERMEDIO</a><a href="/ruta.html?ruta=pro" data-route-level="pro">PRO</a><a href="/ruta.html?ruta=lab" data-route-level="lab">LABORATORIO</a></nav><script>(function(){const p=new URLSearchParams(location.search);let t=(p.get('ruta')||'start').toLowerCase();if(t==='start')t='start-v0-4';if(t==='laboratorio')t='lab';document.querySelectorAll('[data-route-level]').forEach(x=>{if(x.dataset.routeLevel===t)x.setAttribute('aria-current','page')})})()</script>
<main class="assessment-page">
    <a href="ruta.html?ruta=start">← Volver a START</a>
    <p id="assessmentKicker" class="muted">EVALUACIÓN</p>
    <h1 id="assessmentTitle">Comprueba lo que has aprendido</h1>
    <p id="assessmentMeta" class="muted">Cargando evaluación…</p>
    <section id="authCard" class="assessment-card">
      <h2>Accede para comenzar</h2>
      <form id="authForm" class="assessment-form">
        <input id="email" type="email" placeholder="Correo electrónico" required>
        <input id="password" type="password" placeholder="Contraseña" required>
        <div class="assessment-actions"><button class="button button-primary" type="submit">Iniciar sesión</button><button class="button" type="button" id="signupButton">Crear cuenta</button></div>
      </form>
      <p id="authStatus" class="assessment-status"></p>
    </section>
    <section id="quizCard" class="assessment-card assessment-hidden">
      <div id="quizIntro"></div>
      <form id="quizForm"></form>
      <div class="assessment-actions"><button class="button button-primary" type="submit" form="quizForm">Enviar evaluación</button><button class="button" type="button" id="logoutButton">Cerrar sesión</button></div>
      <p id="quizStatus" class="assessment-status"></p>
      <div id="result" class="assessment-result assessment-hidden"></div>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="assessment.js?v=start-official"></script>
</body>
</html>
