<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía para empresas · DuckTronSur IA Academy</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="ia-para-empresas.css">
</head>
<body class="auth-page enterprise-page">
  <main class="auth-wrap">
    <header class="auth-top"><a href="mi-campus.html">← Mi Campus</a><span>DuckTronSur IA Academy</span></header>
    <section class="auth-card" aria-labelledby="enterprise-title">
      <p class="auth-kicker">GUÍA PARA EMPRESAS · MÓDULO AUTENTICADO</p>
      <h1 id="enterprise-title">Guía para empresas</h1>
      <p id="enterprise-intro" class="enterprise-intro">Contenido práctico para detectar oportunidades, transformar información y evaluar herramientas de IA con criterio empresarial.</p>
      <p id="enterprise-status" class="auth-message" role="status" aria-live="polite">Comprobando tu acceso…</p>
      <div id="enterprise-catalog" class="enterprise-catalog"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) throw new Error('Supabase client configuration unavailable');
    const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
    const status = document.querySelector('#enterprise-status');
    const catalog = document.querySelector('#enterprise-catalog');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
    const images = {
      1: 'assets/empresas/DuckTronSur_Guia_Empresas_L01_oportunidades_v0.1.png',
      2: 'assets/empresas/DuckTronSur_Guia_Empresas_L02_documentos_reuniones_v0.1.png',
      3: 'assets/empresas/DuckTronSur_Guia_Empresas_L03_evaluar_herramienta_v0.1.png'
    };
    (async () => {
      const { data: userData } = await client.auth.getUser();
      if (!userData.user) { location.href = 'auth.html'; return; }
      const { data: module, error: moduleError } = await client.from('enterprise_modules').select('id,title,description').eq('slug','ia-para-empresas').eq('published',true).single();
      if (moduleError || !module) { status.textContent = 'Este módulo no está disponible ahora.'; status.className = 'auth-message error'; return; }
      const { data: items, error: itemsError } = await client.from('enterprise_module_items').select('position,title,objective,content').eq('module_id',module.id).eq('published',true).order('position');
      if (itemsError || !items?.length) { status.textContent = 'No hay contenidos disponibles ahora.'; status.className = 'auth-message error'; return; }
      document.querySelector('#enterprise-title').textContent = 'Guía para empresas';
      document.querySelector('#enterprise-intro').textContent = module.description;
      catalog.innerHTML = items.map(item => {
        const content = item.content || {};
        return `<article class="enterprise-card">
          <img src="${images[item.position] || ''}" alt="" loading="lazy">
          <div class="enterprise-card-body">
            <p class="auth-kicker">LECCIÓN ${String(item.position).padStart(2,'0')}</p>
            <h2>${escapeHtml(item.title)}</h2>
            <p>${escapeHtml(item.objective)}</p>
            <a class="neon-button" href="ia-para-empresas-leccion.html?position=${encodeURIComponent(item.position)}">Entrar en la lección</a>
          </div>
        </article>`;
      }).join('');
      status.textContent = `${items.length} lecciones disponibles para tu cuenta.`;
      status.className = 'auth-message success';
    })().catch(() => { status.textContent = 'No se ha podido cargar la guía. Inténtalo de nuevo.'; status.className = 'auth-message error'; });
  </script>
</body>
</html>
