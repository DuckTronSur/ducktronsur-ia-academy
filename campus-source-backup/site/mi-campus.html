<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Campus · DuckTronSur IA Academy</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <header class="auth-top">
      <a href="/">← Campus</a>
      <span>DuckTronSur IA Academy</span>
    </header>

    <section class="auth-card">
      <p class="auth-kicker">MI CAMPUS</p>
      <h1 id="welcome">Tu espacio de aprendizaje</h1>
      <p id="account">Comprobando tu sesión...</p>

      <div class="hero-actions">
        <a class="button" href="/#rutas">Ver las rutas</a>
        <button class="button" id="logout" type="button">Cerrar sesión</button>
      </div>

      <p class="auth-message" id="campus-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>

  <script>
    const welcome = document.querySelector('#welcome');
    const account = document.querySelector('#account');
    const message = document.querySelector('#campus-message');
    const logout = document.querySelector('#logout');

    function showError(text) {
      welcome.textContent = 'No se ha podido cargar Mi Campus';
      account.textContent = text;
      message.textContent = 'Vuelve a iniciar sesión y prueba de nuevo.';
      message.className = 'auth-message error';
    }

    if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
      showError('La configuración de acceso no está disponible.');
    } else {
      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
      );

      (async () => {
        try {
          const { data, error } = await client.auth.getUser();

          if (error) throw error;

          if (!data.user) {
            window.location.href = '/auth.html';
            return;
          }

          const name = data.user.user_metadata?.display_name || data.user.email;
          welcome.textContent = 'Hola, ' + name;
          account.textContent = 'Has iniciado sesión con ' + data.user.email + '.';
          message.textContent = 'Tu sesión está activa.';
          message.className = 'auth-message success';
        } catch (error) {
          console.error(error);
          showError('No se ha podido recuperar la sesión de Supabase.');
        }
      })();

      logout.addEventListener('click', async () => {
        await client.auth.signOut();
        window.location.href = '/auth.html';
      });
    }
  </script>
</body>
</html>
