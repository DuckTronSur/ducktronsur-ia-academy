<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi Campus · DuckTronSur IA Academy"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><main class="auth-wrap"><header class="auth-top"><a href="./">← Campus</a><span>DuckTronSur IA Academy</span></header><section class="auth-card"><p class="auth-kicker">MI CAMPUS</p><h1 id="welcome">Tu espacio de aprendizaje</h1><p id="account"></p><div class="hero-actions"><a class="button" href="./#rutas">Ver las rutas</a><button class="button" id="logout" type="button">Cerrar sesión</button></div><p class="auth-message success" id="campus-message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);(async()=>{const {data}=await client.auth.getUser();if(!data.user){location.href='auth.html';return}const name=data.user.user_metadata?.display_name||data.user.email;document.querySelector('#welcome').textContent='Hola, '+name;document.querySelector('#account').textContent='Has iniciado sesión con '+data.user.email+'. Aquí podrás continuar tus rutas y guardar tu progreso.'})();document.querySelector('#logout').addEventListener('click',async()=>{await client.auth.signOut();location.href='auth.html'});</script></body></html>
