<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Ruta · DuckTronSur IA Academy</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/brand-overrides.css">
<style>
:root{--navy:#06152e;--cyan:#00cfff;--paper:#f3f7fb;--ink:#0a203a;--muted:#5c7184;--route:#ffc83d;--route-soft:#fff7d8;--green:#20d879}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}.route-shell{width:min(1240px,calc(100% - 40px));margin:auto}.route-nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 16px;background:var(--navy);border-radius:0 0 16px 16px}.route-brand img{display:block;width:190px}.route-nav-links{display:flex;gap:10px;align-items:center}.route-nav-links a,.route-account{padding:10px 13px;color:#fff;font-size:.78rem;font-weight:800;text-decoration:none;border-radius:10px}.route-nav-links a:hover,.route-account:hover{background:#e4f5fb}.route-account{border:2px solid var(--cyan);color:#fff}
.route-hero{position:relative;overflow:hidden;min-height:330px;display:flex;align-items:end;border-radius:24px;background:var(--navy);box-shadow:0 18px 42px #06152e2b;color:#fff}.route-hero::after{position:absolute;inset:0;content:"";background:linear-gradient(90deg,#06152ef2 0%,#06152eae 34%,#06152e22 72%,transparent);pointer-events:none}.route-hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#06152e}.route-hero-copy{position:relative;z-index:1;max-width:590px;padding:42px 42px 38px}.eyebrow{margin:0;color:#75e6ff;font:700 .68rem 'DM Mono',monospace;letter-spacing:.14em}.route-hero h1{margin:11px 0 3px;font-size:clamp(2.7rem,7vw,5.4rem);letter-spacing:-.08em;line-height:.94}.route-hero h1 span{color:var(--route)}.route-level{margin:0;color:#fff;font-size:1.5rem;font-weight:800}.route-hero-copy>p:not(.eyebrow):not(.route-level){max-width:430px;margin:13px 0;color:#d6e8f4;line-height:1.55}.neon-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border:2px solid var(--route);border-radius:12px;background:#201c0d;color:var(--route);font-weight:900;text-decoration:none;box-shadow:0 0 9px var(--route),0 0 24px color-mix(in srgb,var(--route),transparent 65%),inset 0 0 12px #fff2;cursor:pointer}.neon-button:hover{filter:brightness(1.2);transform:translateY(-1px)}.hero-action{margin-top:18px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.summary-card{display:flex;align-items:center;gap:12px;min-height:88px;padding:15px 17px;background:#fff;border:1px solid #dce9ee;border-radius:16px;box-shadow:0 8px 20px #173b4b0d}.summary-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--route-soft);color:#b07b00;font-size:1.4rem}.summary-card strong{display:block;color:var(--ink);font-size:1.55rem}.summary-card span{display:block;color:var(--muted);font-size:.74rem}
.content-grid{display:grid;grid-template-columns:minmax(0,1.36fr) minmax(280px,.64fr);gap:17px;margin-top:26px}.panel{background:#fff;border:1px solid #dce9ee;border-radius:20px;padding:24px;box-shadow:0 10px 25px #173b4b0d}.panel-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:0 0 17px}.panel-title h2{margin:0;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:-.05em}.panel-title p{margin:0;color:var(--muted);font-size:.78rem}.lesson-list{display:grid;gap:11px}.lesson-card{position:relative;display:grid;grid-template-columns:52px 132px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid #dce9ee;border-left:5px solid var(--lesson-color);border-radius:16px;background:#fbfdff;color:inherit;text-decoration:none}.lesson-card:hover{box-shadow:0 6px 15px #173b4b14;transform:translateY(-1px)}.lesson-number{width:42px;height:42px;display:grid;place-items:center;border:3px solid var(--lesson-color);border-radius:50%;background:#fff;color:var(--lesson-color);font-weight:900}.lesson-card.done .lesson-number{background:var(--green);border-color:var(--green);color:#063b31}.lesson-image{width:132px;height:78px;object-fit:contain;border-radius:10px;background:#06243f}.lesson-kicker{color:var(--lesson-color);font:700 .62rem 'DM Mono',monospace;letter-spacing:.09em}.lesson-card h3{margin:5px 0 3px;font-size:1rem}.lesson-card p{margin:0;color:var(--muted);font-size:.75rem;line-height:1.4}.status{padding:6px 9px;border-radius:999px;background:#edf3f6;color:#547080;font:700 .62rem 'DM Mono',monospace;white-space:nowrap}.lesson-card.done .status{background:#d8faea;color:#087e59}.lesson-card.current .status{background:var(--route-soft);color:#8a6200}.lesson-card.current{border-color:var(--route);background:#fffdf2}.lesson-card.locked{opacity:.6}
.route-sidebar{display:grid;gap:15px;align-content:start}.side-card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:20px;box-shadow:0 10px 25px #173b4b0d}.side-card h3{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:1.1rem}.side-card p{margin:0;color:#506579;font-size:.82rem;line-height:1.55}.progress-side{background:linear-gradient(135deg,#fff,#f8fdff)}.ring-wrap{display:flex;align-items:center;gap:18px}.ring{--value:0;width:128px;height:128px;display:grid;place-items:center;flex:0 0 128px;border-radius:50%;background:conic-gradient(var(--route) calc(var(--value)*1%),#e0eaf0 0);box-shadow:0 0 18px color-mix(in srgb,var(--route),transparent 65%)}.ring::after{position:absolute;content:""}.ring-inner{width:94px;height:94px;display:grid;place-items:center;border-radius:50%;background:#fff;text-align:center}.ring-inner strong{display:block;font-size:1.8rem}.ring-inner span{font:700 .57rem 'DM Mono',monospace}.side-stats{display:grid;gap:7px;color:#506579;font-size:.75rem}.side-stats b{color:var(--ink);font-size:1rem}.goal-card{background:linear-gradient(135deg,#fffdf1,#fff);border-color:var(--route)}.goal-card h3{color:#a36e00}.badge-card{text-align:center}.badge-image{width:130px;height:130px;object-fit:contain;margin:0 auto 6px;display:block}.badge-card.locked .badge-image{filter:grayscale(1);opacity:.45}.badge-card h3{margin:0;font-size:1rem}.badge-card p{margin:5px 0 0;color:var(--muted);font-size:.74rem}.resources{display:grid;gap:0}.resource-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2ebef;color:#65798a;font-size:.77rem}.resource-row:last-child{border-bottom:0}.resource-row a{color:#087ca4;font-weight:800;text-decoration:none}.resource-row.disabled{opacity:.58}
.next-step{margin-top:17px;padding:22px;border:2px solid var(--route);border-radius:20px;background:linear-gradient(110deg,#fff8d7,#fff);box-shadow:0 0 15px color-mix(in srgb,var(--route),transparent 70%)}.next-step h2{margin:8px 0;font-size:1.45rem}.next-step p{margin:0 0 15px;color:#506579;font-size:.86rem;line-height:1.5}.next-inner{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center}.next-inner img{width:100%;height:110px;object-fit:contain;background:#06152e;border-radius:12px}.next-step .neon-button{background:#ffcf29;color:#2b2100}
.learn-section{margin:25px 0 50px;padding:25px;border-radius:20px;background:#e7f8ff;border:1px solid #bfeaf8}.learn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.learn-card{padding:16px;background:#fff;border-radius:14px;border-top:4px solid var(--learn);box-shadow:0 7px 16px #173b4b0b}.learn-card h3{margin:0 0 9px;font-size:.9rem}.learn-card ul{padding:0;margin:0;list-style:none}.learn-card li{padding:4px 0;color:#506579;font-size:.74rem}.learn-card li::before{content:'✓';margin-right:7px;color:var(--learn);font-weight:900}.route-footer{padding:0 0 30px;display:flex;justify-content:space-between;gap:12px}.route-footer a{color:#087ca4;font-weight:800;text-decoration:none}
@media(max-width:1000px){.route-nav-links{display:none}.summary-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.route-sidebar{grid-template-columns:repeat(2,1fr)}.learn-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.route-shell{width:min(100% - 26px,620px)}.route-nav{min-height:68px}.route-brand img{width:160px}.route-hero{min-height:420px;align-items:end}.route-hero::after{background:linear-gradient(0deg,#06152ef2 0%,#06152e50 68%,transparent)}.route-hero-copy{padding:28px 24px}.route-hero-image{object-position:center}.summary-grid{grid-template-columns:repeat(2,1fr);gap:9px}.summary-card{padding:12px 10px}.summary-icon{width:35px;height:35px;flex-basis:35px}.summary-card strong{font-size:1.25rem}.summary-card span{font-size:.66rem}.panel{padding:18px}.lesson-card{grid-template-columns:42px 1fr auto;gap:10px}.lesson-image{grid-column:2/3;grid-row:1/2;width:100%;height:88px}.lesson-card>div:nth-of-type(1){grid-column:2;grid-row:2}.lesson-card .status{grid-column:3;grid-row:2}.lesson-number{grid-row:1/3;width:38px;height:38px}.route-sidebar{grid-template-columns:1fr}.next-inner{grid-template-columns:1fr}.next-inner img{height:150px}.learn-grid{grid-template-columns:1fr}.route-footer{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.summary-grid{grid-template-columns:1fr}.route-hero h1{font-size:3.2rem}.route-level{font-size:1.25rem}}
</style>
</head>
<body>
<main class="route-shell">
<nav class="route-nav" aria-label="Navegación de ruta"><a class="route-brand" href="/"><img src="/assets/logo-horizontal.png" alt="DuckTronSur IA Academy"></a><div class="route-nav-links"><a href="/#rutas">Mis cursos</a><a href="/prompteca.html">Recursos</a><a href="https://chat.whatsapp.com/DeI65xZLzYA47fKKAjiCee" target="_blank" rel="noopener">Comunidad</a><a href="/#como-funciona">Ayuda</a></div><a class="route-account" href="/mi-campus.html">Mi Campus</a></nav>
<div id="route-app"><p>Cargando ruta…</p></div><footer class="route-footer"><a href="/mi-campus.html">← Volver a Mi Campus</a><a href="/#rutas">Explorar otras rutas</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="/supabase-config.js"></script>
<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const params=new URLSearchParams(location.search);const slug=(params.get('ruta')||'start').toLowerCase();const routeData={start:{name:'START',level:'Iniciación',color:'#ffc83d',soft:'#fff7d8',hero:'/assets/routes/route-start-hero.jpg',fallback:'/assets/ruta-start-v1.png',description:'Fundamentos para empezar a trabajar con inteligencia artificial.',objective:'Al finalizar START serás capaz de utilizar las principales herramientas de IA, crear buenas instrucciones y aplicarlas en tareas reales de tu día a día.',learn:[['Conceptos clave',['Qué es la IA','Cómo funciona','Qué puede hacer por ti']],['Prompts efectivos',['Instrucciones claras','Plantillas y ejemplos','Técnicas de mejora']],['Herramientas principales',['ChatGPT, Gemini y Claude','Generación de contenido','Aplicaciones prácticas']],['Caso práctico final',['Tu primer flujo de trabajo','Paso a paso','Aplicación real']]],lessons:[['Qué es la IA y qué puede hacer','Comprende qué es la inteligencia artificial y cómo puede ayudarte.','/assets/routes/start-lesson-1.jpg'],['Cómo escribir una buena instrucción','Aprende a crear prompts efectivos para obtener mejores resultados.','/assets/routes/start-lesson-2.jpg'],['Cómo comprobar una respuesta','Aprende a evaluar, verificar y mejorar las respuestas de la IA.','/assets/routes/start-lesson-3.jpg'],['Tu primer flujo de trabajo','Aplica lo aprendido en un caso práctico paso a paso.','/assets/routes/start-lesson-4.jpg']]},intermedio:{name:'INTERMEDIO',level:'Consolidación',color:'#16a7ed',soft:'#e5f8ff',fallback:'/assets/ruta-intermedio-v1.png',description:'Mejora tus resultados y convierte tus instrucciones en procesos reutilizables.',objective:'Convierte tus mejores instrucciones en procesos claros y repetibles.',learn:[['Contexto',['Define objetivos','Aporta información útil']],['Prompts',['Estructuras reutilizables','Variables y ejemplos']],['Documentos',['Organiza información','Revisa resultados']],['Proceso final',['Documenta tu método','Repítelo con criterio']]],lessons:[['Contexto y objetivos','Define correctamente el contexto y el resultado que necesitas.'],['Plantillas de prompts','Crea instrucciones reutilizables para tareas frecuentes.'],['Revisión y mejora','Mejora tus resultados mediante revisión y reformulación.'],['Trabajar con documentos','Organiza y analiza documentos con ayuda de la IA.'],['Proceso reutilizable','Convierte una tarea puntual en un procedimiento estable.']]},pro:{name:'PRO',level:'Avanzado',color:'#ff8a00',soft:'#fff1e5',fallback:'/assets/ruta-pro-v1.png',description:'Diseña sistemas de trabajo con IA aplicados a proyectos reales.',objective:'Diseña procesos con IA que puedan aplicarse y supervisarse en proyectos reales.',learn:[['Diseño',['Define un caso','Ordena el proceso']],['Automatización',['Detecta tareas repetibles','Conecta herramientas']],['Supervisión',['Revisa resultados','Controla riesgos']],['Proyecto final',['Documenta decisiones','Entrega un piloto']]],lessons:[['Diseñar un proceso','Diseña procesos de IA aplicados a proyectos reales.'],['Automatizaciones básicas','Identifica tareas repetitivas que pueden automatizarse.'],['Conectar herramientas','Combina distintas herramientas para completar un flujo.'],['Agentes y supervisión','Comprende cómo supervisar sistemas con capacidad de acción.'],['Seguridad y control','Aplica controles básicos de seguridad, privacidad y calidad.']]},lab:{name:'LAB',level:'Profesional',color:'#a855f7',soft:'#f1e8ff',fallback:'/assets/ruta-lab-v1.png',description:'Lleva una idea desde el caso de uso hasta un piloto documentado y evaluable.',objective:'Construye y evalúa un piloto profesional con documentación suficiente para continuar.',learn:[['Caso de uso',['Selecciona un problema','Define el alcance']],['Prototipo',['Construye una primera versión','Prueba con usuarios']],['Evaluación',['Mide resultados','Corrige lo necesario']],['Entrega',['Documenta el piloto','Prepara la continuidad']]],lessons:[['Definir un caso de uso','Selecciona un problema concreto que merezca un piloto.'],['Prototipo funcional','Construye una primera solución comprobable.'],['Pruebas y evaluación','Mide si el prototipo produce resultados útiles.'],['Documentación y entrega','Deja preparado el procedimiento para continuar o escalar.' ]]}};routeData.start.badge='/assets/routes/badge-start.png';routeData.intermedio.badge='/assets/nivel-intermedio-azul.png';routeData.pro.badge='/assets/nivel-pro-avanzado-naranja.png';routeData.lab.badge='/assets/nivel-lab-profesional-violeta.png';const route=routeData[slug]||routeData.start;document.documentElement.style.setProperty('--route',route.color);document.documentElement.style.setProperty('--route-soft',route.soft);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const app=document.querySelector('#route-app');
async function render(){const auth=await client.auth.getUser();const user=auth.data?.user||null;const courseResult=await client.from('courses').select('id,slug,title,description').eq('slug',slug).eq('published',true).maybeSingle();if(courseResult.error)throw courseResult.error;const course=courseResult.data;let dbLessons=[];if(course){const result=await client.from('lessons').select('id,title,position').eq('course_id',course.id).eq('published',true).order('position',{ascending:true});if(result.error)throw result.error;dbLessons=result.data||[]}let completed=new Set();if(user&&dbLessons.length){const result=await client.from('lesson_progress').select('lesson_id,completed').eq('user_id',user.id).eq('completed',true);if(result.error)throw result.error;completed=new Set((result.data||[]).map(x=>x.lesson_id))}const lessons=route.lessons.map((fallback,i)=>({id:dbLessons[i]?.id||null,title:dbLessons[i]?.title||fallback[0],description:fallback[1],image:fallback[2]||route.fallback,number:i+1,done:Boolean(dbLessons[i]&&completed.has(dbLessons[i].id))}));const total=lessons.length,done=lessons.filter(x=>x.done).length,progress=total?Math.round(done/total*100):0;const current=lessons.findIndex(x=>!x.done);const currentIndex=current<0?total-1:current;const badgeState=progress>=100?'CONSEGUIDA':progress>0?'EN PROGRESO':'BLOQUEADA';const next=lessons.find(x=>!x.done);const hero=route.hero||route.fallback;app.innerHTML=`<section class="route-hero"><img class="route-hero-image" src="${hero}" alt="Mentor de la ruta ${route.name}"><div class="route-hero-copy"><p class="eyebrow">RUTA</p><h1>RUTA <span>${route.name}</span></h1><p class="route-level">${route.level}</p><p>${route.description}</p><a class="neon-button hero-action" href="${next?`/leccion.html?ruta=${slug}&leccion=${next.number}`:'#itinerary'}">▶ &nbsp; ${next?'Continuar aprendizaje':'Ruta completada'}</a></div></section><section class="summary-grid"><div class="summary-card"><div class="summary-icon">▤</div><div><strong>${total}</strong><span>lecciones en esta ruta</span></div></div><div class="summary-card"><div class="summary-icon">✓</div><div><strong>${done}</strong><span>lecciones completadas</span></div></div><div class="summary-card"><div class="summary-icon">◔</div><div><strong>${progress}%</strong><span>progreso de la ruta</span></div></div><div class="summary-card"><div class="summary-icon">★</div><div><strong>${progress>0?1:0}</strong><span>insignia ${badgeState.toLowerCase()}</span></div></div></section><div class="content-grid"><section class="panel" id="itinerary"><div class="panel-title"><h2>Tu itinerario de aprendizaje</h2><p>Completa las lecciones en orden y aplica cada concepto.</p></div><div class="lesson-list">${lessons.map((l,i)=>{const state=l.done?'done':i===current?'current':'';const label=l.done?'COMPLETADA':i===current?'EN CURSO':'PENDIENTE';return `<a class="lesson-card ${state}" style="--lesson-color:${route.color}" href="/leccion.html?ruta=${slug}&leccion=${l.number}"><span class="lesson-number">${l.done?'✓':l.number}</span><img class="lesson-image" src="${l.image||route.fallback}" alt="${esc(l.title)}" loading="lazy"><div><span class="lesson-kicker">LECCIÓN ${l.number}</span><h3>${esc(l.title)}</h3><p>${esc(l.description)}</p></div><span class="status">${label}</span></a>`}).join('')}</div></section><aside class="route-sidebar"><section class="side-card progress-side"><h3>◔ Tu progreso en ${route.name}</h3><div class="ring-wrap"><div class="ring" style="--value:${progress}"><div class="ring-inner"><div><strong>${progress}%</strong><span>COMPLETADO</span></div></div></div><div class="side-stats"><div><b>${done}</b> completadas</div><div><b>${next?1:0}</b> en curso</div><div><b>${Math.max(total-done-(next?1:0),0)}</b> pendientes</div></div></div></section><section class="side-card goal-card"><h3>◎ Objetivo de esta ruta</h3><p>${route.objective}</p></section><section class="side-card badge-card"><h3>✦ Insignia de la ruta</h3><img class="badge-image ${badgeState==='BLOQUEADA'?'locked':''}" src="${route.badge||route.fallback}" alt="Insignia ${route.name}"><h3>${route.name}</h3><p>${route.level} · ${badgeState.toLowerCase()}</p><div class="route-track" style="--route:${route.color};margin-top:14px"><span style="width:${progress}%"></span></div></section><section class="side-card"><h3>▣ Recursos de esta ruta</h3><div class="resources"><div class="resource-row"><span>Plantillas de prompts</span><a href="/prompteca.html">Abrir</a></div><div class="resource-row disabled"><span>Guías rápidas</span><span>Próximamente</span></div><div class="resource-row disabled"><span>Ejemplos prácticos</span><span>Próximamente</span></div><div class="resource-row disabled"><span>Herramientas recomendadas</span><span>Próximamente</span></div></div></section></aside></div><section class="next-step"><p class="eyebrow" style="color:#9a6d00">TU PRÓXIMO PASO</p><div class="next-inner"><img src="${next?.image||route.fallback}" alt="Siguiente paso de la ruta ${route.name}"><div><h2>${next?`Continúa con la Lección ${next.number}`:'Ruta completada'}</h2><p>${next?esc(next.title):'Has completado las lecciones disponibles de esta ruta.'}</p><a class="neon-button" href="${next?`/leccion.html?ruta=${slug}&leccion=${next.number}`:'/mi-campus.html'}">${next?'Continuar ahora →':'Volver a Mi Campus'}</a></div></div></section><section class="learn-section"><div class="panel-title"><h2>¿Qué aprenderás en ${route.name}?</h2><p>Áreas trabajadas en esta ruta.</p></div><div class="learn-grid">${route.learn.map((block,i)=>`<article class="learn-card" style="--learn:${route.color}"><h3>${block[0]}</h3><ul>${block[1].map(item=>`<li>${esc(item)}</li>`).join('')}</ul></article>`).join('')}</div></section>`}
render().catch(error=>{app.innerHTML=`<section class="panel"><h1>No se ha podido cargar la ruta</h1><p class="error-box">${esc(error.message)}</p><a class="neon-button" href="/mi-campus.html">Volver a Mi Campus</a></section>`;console.error(error)});
</script></body></html>
