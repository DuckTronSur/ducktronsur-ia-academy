<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ruta · DuckTronSur IA Academy</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">

  <style>
    :root {
      --route-color: #18a889;
      --route-soft: #e8f8f3;
      --route-dark: #073b4c;
    }

    body {
      background: #f4f8fa;
      color: #123047;
    }

    .route-page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    .route-nav {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .route-nav a {
      color: var(--route-dark);
      text-decoration: none;
      font-weight: 700;
    }

    .route-hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 28px;
      align-items: center;
      background: white;
      border-top: 8px solid var(--route-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(7, 59, 76, .10);
    }

    .route-badge {
      display: inline-block;
      background: var(--route-soft);
      color: var(--route-color);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .route-hero h1 {
      margin: 14px 0 10px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--route-dark);
    }

    .route-hero p {
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .route-image {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
    }

    .route-section {
      margin-top: 28px;
    }

    .route-section h2 {
      color: var(--route-dark);
    }

    .lesson-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .lesson-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: white;
      border: 1px solid #dce9ee;
      border-left: 6px solid var(--route-color);
      border-radius: 16px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .lesson-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(7, 59, 76, .10);
    }

    .lesson-number {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border-radius: 50%;
      background: var(--route-soft);
      color: var(--route-color);
      font-weight: 900;
    }

    .lesson-card strong {
      display: block;
      color: var(--route-dark);
      margin-bottom: 4px;
    }

    .lesson-card small {
      color: #5d7280;
    }

    .route-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .route-button {
      display: inline-block;
      background: var(--route-color);
      color: white;
      border-radius: 10px;
      padding: 12px 18px;
      text-decoration: none;
      font-weight: 800;
    }

    .route-button.secondary {
      background: var(--route-soft);
      color: var(--route-color);
    }

    @media (max-width: 720px) {
      .route-hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }

      .route-image {
        max-height: 180px;
      }

      .route-nav {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="route-page">
    <nav class="route-nav">
      <a href="/">← Volver al Campus</a>
      <a href="/mi-campus.html">Mi Campus</a>
    </nav>

    <section id="route-app">
      <p>Cargando ruta…</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>

  <script>
    const client = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const routeData = {
      start: {
        name: 'START',
        level: 'Iniciación',
        color: '#18a889',
        soft: '#e8f8f3',
        image: '/assets/ruta-start-v1.png',
        description: 'Empieza desde cero y aprende a utilizar la inteligencia artificial con criterio y seguridad.',
        lessons: [
          ['que-es-la-ia', 'Qué es la IA y qué puede hacer'],
          ['como-escribir-una-buena-instruccion', 'Cómo escribir una buena instrucción'],
          ['como-comprobar-una-respuesta', 'Cómo comprobar una respuesta'],
          ['tu-primer-flujo-de-trabajo', 'Tu primer flujo de trabajo']
        ]
      },
      intermedio: {
        name: 'INTERMEDIO',
        level: 'Consolidación',
        color: '#2474c6',
        soft: '#eaf2ff',
        image: '/assets/ruta-intermedio-v1.png',
        description: 'Mejora tus resultados y convierte tus instrucciones en procesos reutilizables.',
        lessons: [
          ['contexto-y-objetivos', 'Contexto y objetivos'],
          ['plantillas-de-prompts', 'Plantillas de prompts'],
          ['revision-y-mejora', 'Revisión y mejora'],
          ['trabajar-con-documentos', 'Trabajar con documentos'],
          ['proceso-reutilizable', 'Proceso reutilizable']
        ]
      },
      pro: {
        name: 'PRO',
        level: 'Avanzado',
        color: '#e87519',
        soft: '#fff1e5',
        image: '/assets/ruta-pro-v1.png',
        description: 'Diseña sistemas de trabajo con IA aplicados a proyectos reales.',
        lessons: [
          ['disenar-un-proceso', 'Diseñar un proceso'],
          ['automatizaciones-basicas', 'Automatizaciones básicas'],
          ['conectar-herramientas', 'Conectar herramientas'],
          ['agentes-y-supervision', 'Agentes y supervisión'],
          ['seguridad-y-control', 'Seguridad y control']
        ]
      },
      lab: {
        name: 'LAB',
        level: 'Profesional',
        color: '#7654c8',
        soft: '#f0ebff',
        image: '/assets/ruta-lab-v1.png',
        description: 'Lleva una idea desde el caso de uso hasta un piloto documentado y evaluable.',
        lessons: [
          ['definir-un-caso-de-uso', 'Definir un caso de uso'],
          ['prototipo-funcional', 'Prototipo funcional'],
          ['pruebas-y-evaluacion', 'Pruebas y evaluación'],
          ['documentacion-y-entrega', 'Documentación y entrega']
        ]
      }
    };

    const params = new URLSearchParams(location.search);
    const slug = (params.get('ruta') || 'start').toLowerCase();
    const route = routeData[slug] || routeData.start;

    document.documentElement.style.setProperty('--route-color', route.color);
    document.documentElement.style.setProperty('--route-soft', route.soft);

    const app = document.querySelector('#route-app');

    async function renderRoute() {
      const { data: { user } } = await client.auth.getUser();

      app.innerHTML = `
        <section class="route-hero">
          <div>
            <span class="route-badge">${route.name} · ${route.level}</span>
            <h1>Ruta ${route.name}</h1>
            <p>${route.description}</p>
          </div>
          <img class="route-image" src="${route.image}" alt="Ilustración de la ruta ${route.name}">
        </section>

        <section class="route-section">
          <h2>Tu itinerario de aprendizaje</h2>
          <p>Completa las lecciones en orden y aplica cada concepto a una tarea real.</p>

          <div class="lesson-list">
            ${route.lessons.map((lesson, index) => `
              <a class="lesson-card" href="/leccion.html?ruta=${slug}&leccion=${index + 1}">
                <span class="lesson-number">${index + 1}</span>
                <span>
                  <strong>${lesson[1]}</strong>
                  <small>Lección ${index + 1} · ${route.name}</small>
                </span>
              </a>
            `).join('')}
          </div>
        </section>

        <footer class="route-footer">
          <a class="route-button" href="/mi-campus.html">Ver mi progreso</a>
          <a class="route-button secondary" href="/#rutas">Explorar otras rutas</a>
          ${user ? '<span class="auth-message success">Sesión iniciada</span>' : ''}
        </footer>
      `;
    }

    renderRoute().catch(error => {
      app.innerHTML = `
        <h1>No se ha podido cargar la ruta</h1>
        <p class="auth-message error">${error.message}</p>
        <a class="route-button" href="/">Volver al Campus</a>
      `;
    });
  </script>
</body>
</html>
