<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lección · DuckTronSur IA Academy</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-wrap">
      <header class="auth-top">
        <a href="/ruta.html">← Volver a la ruta</a>
        <span>DuckTronSur IA Academy</span>
      </header>

      <div id="lesson-app">
        <p>Cargando lección…</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>

  <script>
    const client = window.supabaseClient || supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const lessons = {
      start: [
        ['que-es-la-ia', 'Qué es la IA y qué puede hacer', 'Comprende qué es la inteligencia artificial y dónde puede ayudarte.'],
        ['como-escribir-una-buena-instruccion', 'Cómo escribir una buena instrucción', 'Aprende a pedir mejores resultados a una herramienta de IA.'],
        ['como-comprobar-una-respuesta', 'Cómo comprobar una respuesta', 'Aprende a revisar, contrastar y mejorar una respuesta generada por IA.'],
        ['tu-primer-flujo-de-trabajo', 'Tu primer flujo de trabajo', 'Construye un proceso sencillo y repetible con inteligencia artificial.']
      ],
      intermedio: [
        ['contexto-y-objetivos', 'Contexto y objetivos', 'Define correctamente el contexto y el resultado que necesitas.'],
        ['plantillas-de-prompts', 'Plantillas de prompts', 'Crea instrucciones reutilizables para tareas frecuentes.'],
        ['revision-y-mejora', 'Revisión y mejora', 'Mejora tus resultados mediante revisión y reformulación.'],
        ['trabajar-con-documentos', 'Trabajar con documentos', 'Organiza y analiza documentos con ayuda de la IA.'],
        ['proceso-reutilizable', 'Proceso reutilizable', 'Convierte una tarea puntual en un procedimiento estable.']
      ],
      pro: [
        ['disenar-un-proceso', 'Diseñar un proceso', 'Diseña procesos de IA aplicados a proyectos reales.'],
        ['automatizaciones-basicas', 'Automatizaciones básicas', 'Identifica tareas repetitivas que pueden automatizarse.'],
        ['conectar-herramientas', 'Conectar herramientas', 'Combina distintas herramientas para completar un flujo.'],
        ['agentes-y-supervision', 'Agentes y supervisión', 'Comprende cómo supervisar sistemas con capacidad de acción.'],
        ['seguridad-y-control', 'Seguridad y control', 'Aplica controles básicos de seguridad, privacidad y calidad.']
      ],
      lab: [
        ['definir-un-caso-de-uso', 'Definir un caso de uso', 'Selecciona un problema concreto que merezca un piloto.'],
        ['prototipo-funcional', 'Prototipo funcional', 'Construye una primera solución comprobable.'],
        ['pruebas-y-evaluacion', 'Pruebas y evaluación', 'Mide si el prototipo produce resultados útiles.'],
        ['documentacion-y-entrega', 'Documentación y entrega', 'Deja preparado el procedimiento para continuar o escalar.']
      ]
    };

    const routeNames = {
      start: 'START',
      intermedio: 'INTERMEDIO',
      pro: 'PRO',
      lab: 'LAB'
    };

    const app = document.querySelector('#lesson-app');
    const params = new URLSearchParams(location.search);
    const route = (params.get('ruta') || 'start').toLowerCase();
    const number = Number(params.get('leccion') || '1');
    const routeLessons = lessons[route] || lessons.start;
    const current = routeLessons[number - 1] || routeLessons[0];

    const slugify = value => value
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');

    async function loadLesson() {
      const { data: { user } } = await client.auth.getUser();
      const lessonSlug = current[0];
      let completed = false;
      let dbLesson = null;

      const { data: course } = await client
        .from('courses')
        .select('id,slug,title')
        .eq('slug', route)
        .eq('published', true)
        .maybeSingle();

      if (course) {
        const { data: lesson } = await client
          .from('lessons')
          .select('id,slug,title,content')
          .eq('course_id', course.id)
          .eq('slug', lessonSlug)
          .eq('published', true)
          .maybeSingle();

        dbLesson = lesson;

        if (user && lesson) {
          const { data: progress } = await client
            .from('lesson_progress')
            .select('completed')
            .eq('user_id', user.id)
            .eq('lesson_id', lesson.id)
            .maybeSingle();

          completed = Boolean(progress && progress.completed);
        }
      }

      const title = dbLesson?.title || current[1];
      const description = current[2];
      const content = dbLesson?.content || `
        <p>${description}</p>
        <h2>Qué vas a aprender</h2>
        <p>En esta lección trabajarás este concepto con un enfoque práctico y aplicable a tus propios proyectos.</p>
        <h2>Actividad</h2>
        <p>Aplica lo aprendido a una tarea real. Escribe el resultado, revisa la respuesta y anota qué mejorarías.</p>
      `;

      app.innerHTML = `
        <p class="auth-eyebrow">${routeNames[route] || 'ACADEMIA'} · LECCIÓN ${number}</p>
        <h1>${title}</h1>
        <p class="auth-lead">${description}</p>

        <article class="lesson-content">
          ${content}
        </article>

        <div class="lesson-actions">
          <button id="complete-button" class="auth-button" ${completed ? 'disabled' : ''}>
            ${completed ? 'Lección completada' : 'Marcar como completada'}
          </button>
          <a class="auth-link" href="/ruta.html?ruta=${route}">Volver a la ruta ${routeNames[route]}</a>
        </div>

        <p id="lesson-message" class="auth-message"></p>
      `;

      const button = document.querySelector('#complete-button');
      const message = document.querySelector('#lesson-message');

      button.addEventListener('click', async () => {
        if (!user) {
          message.textContent = 'Inicia sesión para guardar tu progreso.';
          message.className = 'auth-message error';
          return;
        }

        if (!dbLesson) {
          message.textContent = 'La lección todavía no está conectada al Campus.';
          message.className = 'auth-message error';
          return;
        }

        button.disabled = true;

        const { error } = await client
          .from('lesson_progress')
          .upsert(
            {
              user_id: user.id,
              lesson_id: dbLesson.id,
              completed: true
            },
            {
              onConflict: 'user_id,lesson_id'
            }
          );

        if (error) {
          button.disabled = false;
          message.textContent = 'No se ha podido guardar el progreso. Comprueba tu sesión.';
          message.className = 'auth-message error';
          return;
        }

        button.textContent = 'Lección completada';
        message.textContent = 'Tu progreso se ha guardado correctamente.';
        message.className = 'auth-message success';
      });
    }

    loadLesson().catch(error => {
      app.innerHTML = `
        <h1>No se ha podido cargar la lección</h1>
        <p class="auth-message error">${error.message}</p>
        <a class="auth-link" href="/">Volver al Campus</a>
      `;
    });
  </script>
</body>
</html>
