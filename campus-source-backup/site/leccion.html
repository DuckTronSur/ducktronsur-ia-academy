<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lección · DuckTronSur IA Academy"><link rel="stylesheet" href="styles.css"><style>.lesson-page{max-width:820px;margin:auto;padding:48px 24px 90px}.lesson-page header{display:flex;justify-content:space-between;margin-bottom:70px}.lesson-tag{font:700 .78rem monospace;letter-spacing:.12em;color:#008dbe}.lesson-page h1{font-size:clamp(2.5rem,6vw,4.8rem);line-height:1;letter-spacing:-.06em;margin:16px 0}.lesson-page h2{margin-top:48px}..lesson-page p,.lesson-page li{font-size:1.04rem;line-height:1.75;color:#405269}..lesson-box{padding:24px;background:#eef8fc;border-left:4px solid #00a9e2}.lesson-action{margin-top:42px;display:inline-block;padding:15px 20px;background:#06152e;color:#fff;text-decoration:none;font-weight:700}.back{display:inline-block;margin-top:28px}</style></head>
<body><main class="lesson-page" id="app"></main><script>
const start=[
 {title:'Qué es la IA y qué puede hacer',objective:'Distinguir qué tareas puede apoyar una herramienta de IA y cuáles necesitan revisión humana.',body:'La inteligencia artificial genera resultados a partir de patrones aprendidos. Puede ayudarte a resumir, comparar, redactar, idear y transformar información. No garantiza que una respuesta sea cierta: tu criterio sigue siendo parte del proceso.',practice:['Elige una tarea real de tu trabajo.','Escribe qué información tienes y qué resultado necesitas.','Decide qué parte puede preparar la IA y qué parte revisarás tú.'],check:'He separado la ayuda de la IA de la decisión final.'},
 {title:'Cómo escribir una buena instrucción',objective:'Crear una instrucción clara con contexto, objetivo, formato y límites.',body:'Una petición útil explica la situación, el resultado esperado y las condiciones que debe respetar la respuesta. Añadir un ejemplo o pedir una estructura concreta suele mejorar el resultado.',practice:['Describe el contexto en dos frases.','Indica el objetivo y el público.','Pide un formato concreto y añade una limitación.'],check:'Mi instrucción permite saber qué debe responder la herramienta y cómo debe hacerlo.'},
 {title:'Cómo comprobar una respuesta',objective:'Revisar una respuesta de IA antes de utilizarla o compartirla.',body:'Comprueba los datos importantes, las fechas, las fuentes y los supuestos. Pide que la respuesta señale incertidumbres y contrasta los puntos que puedan causar un error.',practice:['Marca las tres afirmaciones más importantes.','Comprueba cada una con una fuente fiable.','Reescribe el resultado indicando qué has verificado.'],check:'He verificado las afirmaciones importantes y he señalado lo que sigue pendiente.'},
 {title:'Tu primer flujo de trabajo',objective:'Convertir una tarea repetitiva en un proceso sencillo con revisión humana.',body:'Un flujo de trabajo define una entrada, varios pasos y un resultado. Empieza por un caso pequeño, guarda la instrucción que funciona y revisa el resultado antes de incorporarlo a tu rutina.',practice:['Elige una tarea semanal.','Escribe sus pasos actuales.','Prueba un paso con IA y añade una revisión final.'],check:'Tengo un proceso escrito que puedo repetir y mejorar.'}
];
const n=Math.max(1,Math.min(4,Number(new URLSearchParams(location.search).get('leccion'))||1)); const l=start[n-1];
document.title=l.title+' · DuckTronSur IA Academy'; document.querySelector('#app').innerHTML=`<header><a href="ruta.html?ruta=start">← Volver a START</a><span>DuckTronSur IA Academy</span></header><p class="lesson-tag">START · LECCIÓN ${String(n).padStart(2,'0')}</p><h1>${l.title}</h1><div class="lesson-box"><strong>Objetivo</strong><p>${l.objective}</p></div><h2>Idea clave</h2><p>${l.body}</p><h2>Práctica</h2><ol>${l.practice.map(x=>`<li>${x}</li>`).join('')}</ol><h2>Comprobación</h2><p>${l.check}</p><a class="lesson-action" href="ruta.html?ruta=start">Continuar con START</a>`;
</script></body></html>
