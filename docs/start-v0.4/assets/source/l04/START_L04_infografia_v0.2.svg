<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="tt dd"><title id="tt">L04 — Tres pasos para mejorar una respuesta de IA</title><desc id="dd">1. Lee el borrador y detecta qué falta. 2. Pide una mejora concreta al asistente. 3. Comprueba el resultado y elige la versión útil.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081429"/><stop offset="1" stop-color="#113954"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="60" y="62" width="1480" height="10" rx="5" fill="#FFD547"/><rect x="60" y="130" width="160" height="52" rx="26" fill="#FFD547"/><text x="93" y="168" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#102037">START</text><text x="252" y="168" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#BCE3F3">LECCIÓN 04 · Mejora las respuestas</text><text x="64" y="268" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Del borrador a la versión útil</text><text x="64" y="317" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFD547">PRÁCTICA EN TRES PASOS</text><rect x="62" y="365" width="475" height="338" rx="28" fill="#163552" stroke="#38D5E7" stroke-width="3"/><circle cx="116" cy="424" r="27" fill="#38D5E7"/><text x="106" y="434" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#102037">1</text><text x="90" y="502" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#38D5E7">REVISA EL BORRADOR</text><text x="90" y="575" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">Lee el resultado y</text><text x="90" y="616" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">detecta qué falta.</text><path d="M539 533 h27 m-12 -11 l12 11 -12 11" fill="none" stroke="#E9F7FF" stroke-width="4"/><rect x="570" y="365" width="475" height="338" rx="28" fill="#163552" stroke="#FFD547" stroke-width="3"/><circle cx="624" cy="424" r="27" fill="#FFD547"/><text x="614" y="434" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#102037">2</text><text x="598" y="502" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#FFD547">PIDE UNA MEJORA</text><text x="598" y="575" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">Solicita un cambio</text><text x="598" y="616" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">claro y concreto.</text><path d="M1047 533 h27 m-12 -11 l12 11 -12 11" fill="none" stroke="#E9F7FF" stroke-width="4"/><rect x="1078" y="365" width="475" height="338" rx="28" fill="#163552" stroke="#38D5E7" stroke-width="3"/><circle cx="1132" cy="424" r="27" fill="#38D5E7"/><text x="1122" y="434" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#102037">3</text><text x="1106" y="502" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#38D5E7">COMPRUEBA Y ELIGE</text><text x="1106" y="575" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">Verifica lo importante</text><text x="1106" y="616" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF">y conserva la versión útil.</text><text x="64" y="768" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="500" fill="#D6F2FA">La mejora no termina al reescribir: hay que revisar el resultado.</text><text x="64" y="825" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="500" fill="#D0E7F1">DuckTronSur IA Academy · Aprende · Crea · Avanza</text><text x="64" y="863" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="500" fill="#B4CAD5">Borrador v0.2 · pendiente de validación editorial y accesibilidad</text></svg>
