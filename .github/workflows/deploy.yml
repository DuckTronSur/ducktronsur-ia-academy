name: Deploy campus to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'campus-source-backup/site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy campus-source-backup/site --project-name=ducktronsur-ia-academy

